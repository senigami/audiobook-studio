[project]
name = "audiobook-studio"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E701", # multiple statements on one line (colon)
    "F841", # local variable assigned but never used
    "F401", # unused import
    "E711", # comparison to None (often used in this codebase)
    "E501", # line too long
    "E722", # bare except
    "W291", # trailing whitespace
]

[tool.coverage.run]
# concurrency = thread preserved from the former .coveragerc: this app runs work
# in threads (boot, watchdog, orchestrator dispatch); without it coverage
# under-counts lines executed off the main thread.
concurrency = ["thread"]
omit = ["plugins/tts_xtts/plugin/core/xtts_inference.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "raise ImportError",
]
